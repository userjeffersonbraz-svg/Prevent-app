<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prevent App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2937">
<link rel="icon" type="image/png" href="icone.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--ink:#1f2937;--muted:#64748b;--line:#e5e7eb;--bg:#f3f4f6;--blue:#2563eb;--green:#059669;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#111827;min-height:100vh;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app-header{background:var(--ink);color:#fff;padding:26px 20px;text-align:center}
.app-header h1{font-size:1.45rem;margin-bottom:5px}.app-header p{font-size:.9rem;opacity:.82}
.home-grid{display:grid;gap:15px;padding:20px;max-width:650px;margin:auto}
.card{display:flex;flex-direction:column;gap:7px;padding:21px;border:0;border-radius:14px;background:#fff;border-left:7px solid var(--cor);box-shadow:0 2px 7px #0000000d;text-align:left;transition:transform .15s}
.card:active{transform:scale(.99)}.card-badge{font-weight:750;font-size:1.08rem;color:var(--cor)}.card-desc{font-size:.88rem;color:var(--muted)}
.app-footer{display:flex;justify-content:center;gap:25px;padding:18px}.footer-link{color:#475569;text-decoration:none;font-size:.9rem}
.app-brand{display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 0 32px}
.app-brand img{width:64px;height:64px;border-radius:14px;box-shadow:0 4px 12px #16a34a40}
.app-brand span{font-size:1.5rem;font-weight:900;font-style:italic;letter-spacing:.14em;text-transform:uppercase;padding-right:.14em;background:linear-gradient(90deg,#15803d,#65a30d);-webkit-background-clip:text;background-clip:text;color:transparent}
.form-header{padding:12px 16px;text-align:center;color:#fff;background:var(--ink);position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between}
.btn-voltar-topo{background:#ffffff26;border:0;color:#fff;font-size:1.25rem;width:40px;height:40px;border-radius:50%}.badge-tipo{padding:9px 14px;border-radius:999px;color:#fff;font-weight:750;font-size:.9rem;flex:1;margin:0 10px}.espaco-vazio{width:40px}
.form-main{max-width:760px;margin:auto;padding:16px}
.cabecalho,.secao{background:#fff;padding:17px;border-radius:13px;margin-bottom:15px;box-shadow:0 1px 4px #0000000a}
.cabecalho h2,.secao h3{font-size:1rem;margin-bottom:13px;color:#334155;border-bottom:2px solid var(--line);padding-bottom:9px}
.cabecalho label{display:block;font-size:.85rem;color:#374151;margin-bottom:12px}.cabecalho input{width:100%;padding:11px;margin-top:5px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{border-bottom:1px solid #f1f5f9;padding:14px 0}.item:last-child{border:0}.item-pergunta{font-weight:650;font-size:.95rem;margin-bottom:10px; display:flex; gap:6px;}
.item-numero { color: #64748b; font-weight: 800; }
.item-ajuda{font-size:.8rem;color:var(--muted);margin:-5px 0 10px}
.opcoes-resposta{display:flex;gap:8px;margin-bottom:10px}.opcoes-resposta button{flex:1;padding:10px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;font-weight:650}
.opcoes-resposta button.ativo-sim{background:#059669;color:#fff;border-color:#059669}
.opcoes-resposta button.ativo-nao{background:#475569;color:#fff;border-color:#475569}
.opcoes-resposta button.ativo-na{background:#94a3b8;color:#fff;border-color:#94a3b8}
.item input[type=number],.item textarea,.item select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:.94rem;margin:0 0 10px;font-family:inherit;transition:background .2s, border-color .2s;}
.item input[type=number].input-auto-alta{border-color:#dc2626;background:#fee2e2;color:#991b1b;font-weight:bold;}
.item input[type=number].input-auto-baixa{border-color:#d97706;background:#fef3c7;color:#92400e;font-weight:bold;}
.item input[type=number].input-auto-ok{border-color:#2563eb;background:#dbeafe;color:#1e40af;font-weight:bold;}
.item textarea{min-height:62px;resize:vertical}.criticidade-label{font-size:.8rem;color:var(--muted);margin:3px 0 6px}
.criticidades{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.criticidades button{padding:10px 4px;border-radius:8px;border:2px solid var(--line);background:#fff;font-size:.82rem;font-weight:700}
.criticidades button[data-crit=alta].ativo{background:#dc2626;color:#fff;border-color:#dc2626}
.criticidades button[data-crit=baixa].ativo{background:#d97706;color:#fff;border-color:#d97706}
.criticidades button[data-crit=operando].ativo{background:#2563eb;color:#fff;border-color:#2563eb}
.foto-area{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.foto-area label{display:inline-block;padding:8px 13px;border-radius:8px;background:#e0e7ff;color:#3730a3;font-size:.84rem;cursor:pointer}
.foto-area input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.foto-preview{position:relative;width:66px;height:66px;border-radius:8px;overflow:hidden;border:1px solid #cbd5e1}.foto-preview img{width:100%;height:100%;object-fit:cover}.foto-preview button{position:absolute;top:0;right:0;background:#000a;color:#fff;border:0;width:21px;height:21px}
.acoes-finais{display:flex;gap:12px;margin:20px 0 40px}.btn-primario,.btn-secundario{flex:1;padding:14px;border-radius:10px;border:0;font-size:.96rem;font-weight:750}.btn-primario{background:var(--ink);color:#fff}.btn-secundario{background:#e2e8f0;color:#334155}
.escondido{display:none!important}
.modal-bg{position:fixed;inset:0;background:#0008;display:flex;justify-content:center;align-items:center;z-index:100;padding:15px}.modal-box{background:#fff;padding:20px;border-radius:13px;width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.modal-header h3{font-size:1.15rem}.search-box{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:12px}
.lista-historico-scroll{overflow-y:auto;flex:1;padding-right:4px}.hist-item{border-bottom:1px solid var(--line);padding:13px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hist-info{font-size:.9rem;min-width:0}.hist-info strong{display:block;margin-bottom:4px;font-size:.93rem;overflow-wrap:anywhere}.hist-info span{color:var(--muted);font-size:.8rem}
.hist-botoes{display:flex;gap:6px;flex-shrink:0}.hist-botoes button{padding:7px 9px;border-radius:6px;border:0;font-size:.78rem;font-weight:700}.btn-ver{background:#2563eb;color:#fff}.btn-del{background:#fee2e2;color:#991b1b}
.sem-resultado{text-align:center;color:var(--muted);margin:22px 0}
.hist-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.btn-tool{padding:8px 10px;border-radius:8px;border:0;background:#e2e8f0;color:#334155;font-size:.78rem;font-weight:700}
.btn-tool.perigo{background:#fee2e2;color:#991b1b}
.badge-teste{background:#ede9fe;color:#5b21b6;font-size:.68rem;padding:2px 6px;border-radius:5px;margin-left:5px;font-style:normal}
.modelo-lampada{border:1px solid var(--line);border-radius:9px;margin-bottom:11px;overflow:hidden}.modelo-header{display:flex;align-items:center;padding:12px;background:#f8fafc}.modelo-header.ativo{background:#eff6ff;border-bottom:1px solid var(--line)}.modelo-header input{width:20px;height:20px;margin-right:12px}.modelo-header span{font-weight:650;color:#334155;flex:1}.modelo-body{padding:12px;display:none}.modelo-body.ativo{display:block}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid-3 label{font-size:.8rem;color:#475569}.grid-3 input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;margin-top:4px;margin-bottom:10px}
.status-auto{display:flex;gap:8px;flex-wrap:wrap;margin:5px 0 10px}.status-chip{padding:6px 9px;border-radius:7px;font-size:.78rem;font-weight:750}.chip-alta{background:#fee2e2;color:#991b1b}.chip-baixa{background:#fef3c7;color:#92400e}.chip-ok{background:#dbeafe;color:#1e40af}
.btn-add-modelo{background:#e0e7ff;color:#3730a3;border:0;padding:11px;border-radius:8px;font-weight:750;width:100%;margin-top:7px}
.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:11px;border-radius:9px;font-size:.82rem;margin-bottom:13px}
.status-final{display:grid;gap:8px}.status-final label{font-size:.88rem;color:#334155}.status-final select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}
@media(max-width:480px){.row-2{grid-template-columns:1fr 1fr;gap:8px}.form-main{padding:11px}.cabecalho,.secao{padding:14px}.acoes-finais{gap:8px}.btn-primario,.btn-secundario{padding:12px;font-size:.9rem}.hist-item{align-items:flex-start}.hist-botoes{flex-direction:column}}
</style>
</head>
<body>
<div id="tela-inicial">
<header class="app-header"><h1>Manutenção Preventiva</h1><p>Registros técnicos, acompanhamento e histórico de inspeções</p></header>
<main class="home-grid">
<button class="card" onclick="iniciarFormulario('luminotecnico')" style="--cor:#d97706"><span class="card-badge">Luminotécnica</span><span class="card-desc">Quantitativo de lâmpadas, luminárias e iluminação de emergência.</span></button>
<button class="card" onclick="iniciarFormulario('inspecao_visual')" style="--cor:#2563eb"><span class="card-badge">Inspeção visual</span><span class="card-desc">Verificação de interfones, botoeiras, PMV, eletroímãs, alarme de incêndio e rack.</span></button>
<button class="card" onclick="iniciarFormulario('lubrificacao_reapertos')" style="--cor:#059669"><span class="card-badge">Lubrificação e reapertos</span><span class="card-desc">Inspeção funcional, limpeza técnica, lubrificação e fixações.</span></button>
</main>
<footer class="app-footer"><a href="#" class="footer-link" onclick="abrirHistorico();return false">📋 Histórico de relatórios</a><a href="admin.html" class="footer-link">⚙️ Administração</a></footer>
<div class="app-brand"><img id="logo-app" alt="Logo Prevent App"><span>Prevent App</span></div>
</div>
<div id="tela-formulario" class="escondido">
<header class="form-header"><button class="btn-voltar-topo" onclick="voltarInicio()" title="Voltar">←</button><div class="badge-tipo" id="badge-tipo">Preventiva</div><div class="espaco-vazio"></div></header>
<main class="form-main">
<section class="cabecalho"><h2>Identificação da inspeção</h2>
<label>Local da inspeção *
  <input type="text" id="local" list="locais-recentes" placeholder="Informe o local ou equipamento" autocomplete="off">
  <datalist id="locais-recentes"></datalist>
</label>
<label>Nome do técnico *<input type="text" id="tecnico" placeholder="Nome completo"></label>
<label style="display:flex;align-items:center;gap:8px;margin-top:-4px;margin-bottom:12px">
  <input type="checkbox" id="salvar-tecnico" checked style="width:auto;margin:0">
  <span style="font-size:.82rem;color:#64748b">Lembrar meus dados para próximas inspeções</span>
</label>
<div class="row-2"><label>Chapa *<input type="text" id="chapa"></label><label>CFT / CREA (opcional)<input type="text" id="cft-crea"></label></div>
<label>Data da inspeção *<input type="date" id="data"></label>
<label style="display:flex;align-items:center;gap:8px;margin-top:4px;margin-bottom:0">
  <input type="checkbox" id="eh-teste" style="width:auto;margin:0">
  <span style="font-size:.82rem;color:#64748b">🧪 Este é um relatório de teste</span>
</label>
</section>
<section id="secoes-container"></section>
<section class="secao"><h3>Encerramento da atividade</h3><div class="status-final"><label>Status da preventiva<select id="status-final"><option value="Concluída sem pendências">Concluída sem pendências</option><option value="Concluída com pendências">Concluída com pendências</option><option value="Parcialmente executada">Parcialmente executada</option></select></label><label>Resumo das pendências / recomendações<textarea id="pendencias" placeholder="Descreva o que ficou pendente, a ação recomendada e, se aplicável, a necessidade de manutenção corretiva." style="width:100%;min-height:75px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin-top:5px"></textarea></label><label>Contramedidas adotadas<textarea id="contramedidas" placeholder="Informe os ajustes, correções ou ações realizadas durante a inspeção." style="width:100%;min-height:65px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin-top:5px"></textarea></label></div></section>
<div class="acoes-finais"><button class="btn-secundario" onclick="voltarInicio()">Cancelar</button><button class="btn-primario" onclick="finalizar()">Finalizar e gerar PDF</button></div>
</main></div>
<div id="modal-historico" class="modal-bg escondido"><div class="modal-box"><div class="modal-header"><h3>Histórico de inspeções</h3><button onclick="fecharHistorico()" style="background:none;border:0;font-size:1.6rem">&times;</button></div><input type="text" id="input-busca" class="search-box" placeholder="Buscar por local, número ou tipo..." oninput="filtrarHistorico()">
<div class="hist-toolbar">
<button class="btn-tool" onclick="selecionarTodosHist()">☑ Marcar todos</button>
<button class="btn-tool perigo" onclick="excluirSelecionados()">🗑 Excluir marcados (<span id="qtd-sel">0</span>)</button>
<button class="btn-tool perigo" onclick="excluirTestes()">🧪 Excluir testes</button>
<button class="btn-tool perigo" onclick="excluirTudo()">Limpar tudo</button>
</div>
<div id="lista-historico" class="lista-historico-scroll"></div><button class="btn-secundario" style="width:100%;margin-top:14px" onclick="fecharHistorico()">Fechar</button></div></div>

 FORMULARIO_ATUAL=DADOS_FORMULARIOS[tipo]||FORMULARIOS_PADRAO[tipo];RESPOSTAS={};MODELOS_LAMPADAS.forEach(m=>m.ativo=false);
 $("tela-inicial").classList.add("escondido");$("tela-formulario").classList.remove("escondido");
 $("badge-tipo").textContent=FORMULARIO_ATUAL.titulo;$("badge-tipo").style.background=FORMULARIO_ATUAL.cor;
 $("data").value=new Date().toLocaleDateString("en-CA");["local","tecnico","chapa","cft-crea","pendencias","contramedidas"].forEach(id=>$(id).value="");
 $("status-final").value="Concluída sem pendências";
 $("eh-teste").checked=false;
 
 // Preenchimento automático do técnico
 const tecSalvo = JSON.parse(localStorage.getItem("tecnico_padrao") || "null");
 if (tecSalvo) {
   $("tecnico").value = tecSalvo.tecnico || "";
   $("chapa").value   = tecSalvo.chapa   || "";
   $("cft-crea").value = tecSalvo.cftCrea || "";
 }
 
 montarSecoes();
 popularLocaisRecentes();
 window.scrollTo(0,0);
}

function popularLocaisRecentes() {
  const hist = lerHistorico();
  const vistos = new Set();
  const opts = hist
    .filter(r => r.tipo === FORMULARIO_ATUAL.id && r.cabecalho?.local)
    .map(r => r.cabecalho.local)
    .filter(l => { const n = normalizar(l); if (vistos.has(n)) return false; vistos.add(n); return true; })
    .slice(0, 15);
  $("locais-recentes").innerHTML = opts.map(l => `<option value="${escapar(l)}">`).join("");
}

$("local")?.addEventListener("change", () => {
  const localAtual = normalizar($("local").value);
  if (!localAtual) return;
  const anterior = lerHistorico().find(r =>
    r.tipo === FORMULARIO_ATUAL.id &&
    normalizar(r.cabecalho?.local) === localAtual
  );
  if (!anterior) return;
  if (!confirm(`Encontrei uma inspeção anterior deste local (${anterior.numero}, em ${formatarData(anterior.cabecalho.data)}).\n\nDeseja carregar as respostas anteriores como ponto de partida?`)) return;
  restaurarDoRelatorio(anterior);
});

function restaurarDoRelatorio(rel) {
  RESPOSTAS = {};
  FORMULARIO_ATUAL.secoes.forEach(sec => {
    (sec.itens || []).forEach(it => {
      const r = rel.respostas?.[it.id];
      if (!r) return;
      RESPOSTAS[it.id] = {
        resposta: r.resposta,
        valor: r.valor,
        criticidade: r.criticidade,
        observacao: r.observacao || ""
      };
    });
  });

  (rel.modelos_lampadas || []).forEach(m => {
    let alvo = MODELOS_LAMPADAS.find(x => normalizar(x.nome) === normalizar(m.nome));
    if (!alvo) { alvo = { id: "m_" + Date.now() + "_" + Math.random().toString(36).slice(2,6), nome: m.nome, ativo: true }; MODELOS_LAMPADAS.push(alvo); }
    alvo.ativo = true;
    RESPOSTAS[`qtde_${alvo.id}`]   = { valor: m.quantidade };
    RESPOSTAS[`queim_${alvo.id}`]  = { valor: m.queimadas };
    RESPOSTAS[`defeito_${alvo.id}`]= { valor: m.defeito };
  });

  $("status-final").value = rel.statusFinal || "Concluída sem pendências";
  $("pendencias").value    = rel.pendencias || "";
  $("contramedidas").value = rel.contramedidas || "";

  montarSecoes();
  window.scrollTo(0, 0);
  alert("Respostas da inspeção anterior carregadas. Revise e ajuste o que mudou.");
}

function voltarInicio(){if(confirm("Deseja sair? Os dados ainda não salvos serão perdidos.")){$("tela-formulario").classList.add("escondido");$("tela-inicial").classList.remove("escondido");}}
function salvarResp(id,valor){RESPOSTAS[id]={...(RESPOSTAS[id]||{}),valor};}
function salvarCrit(id,crit,btn){btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("ativo"));btn.classList.add("ativo");RESPOSTAS[id]={...(RESPOSTAS[id]||{}),criticidade:crit};}
function comprimirImagem(file,maxWidth,callback){
 const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");let w=img.width,h=img.height;if(w>maxWidth){h=Math.round(h*maxWidth/w);w=maxWidth;}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);callback(c.toDataURL("image/jpeg",.68));};img.src=e.target.result;};reader.readAsDataURL(file);
}
function criticidadeAutomatica(queimadas,defeitos){
 if(Number(queimadas)>0)return"alta";if(Number(defeitos)>0)return"baixa";return"operando";
}

  const body=document.createElement("div");body.className="modelo-body "+(m.ativo?"ativo":"");
  const q=RESPOSTAS[`qtde_${m.id}`]?.valor??"",b=RESPOSTAS[`queim_${m.id}`]?.valor??"",d=RESPOSTAS[`defeito_${m.id}`]?.valor??"";
  body.innerHTML=`<div class="grid-3"><label>Instaladas<input type="number" inputmode="numeric" min="0" step="1" value="${q}" placeholder="0" data-campo="qtde"></label><label>Queimadas<input type="number" inputmode="numeric" min="0" step="1" value="${b}" placeholder="0" data-campo="queim"></label><label>Com defeito<input type="number" inputmode="numeric" min="0" step="1" value="${d}" placeholder="0" data-campo="defeito"></label></div><div class="status-auto" aria-live="polite"></div><p class="item-ajuda">Criticidade automática: queimada = alta; com defeito = baixa; sem ocorrência = normal.</p>`;
  const inputs=body.querySelectorAll("input");inputs.forEach(inp=>{inp.addEventListener("input",()=>{const key=inp.dataset.campo;const val=inp.value;if(val!==""&&Number(val)<0){inp.value=0;}salvarResp(`${key}_${m.id}`,inp.value);atualizarStatusModelo(m,body);});});
  head.querySelector("input").addEventListener("change",e=>{m.ativo=e.target.checked;head.classList.toggle("ativo",m.ativo);body.classList.toggle("ativo",m.ativo);if(!m.ativo){["qtde","queim","defeito"].forEach(k=>delete RESPOSTAS[`${k}_${m.id}`]);}});

 });
 const add=document.createElement("button");add.className="btn-add-modelo";add.textContent="+ Adicionar modelo de lâmpada";add.onclick=()=>{const nome=prompt("Nome do modelo (ex.: refletor LED 50 W):");if(nome&&nome.trim()){const id="m_"+Date.now();MODELOS_LAMPADAS.push({id,nome:nome.trim(),ativo:true});renderizarModelosLampadas(container);}};container.append(add);
}
function atualizarStatusModelo(m,body){
 const q=RESPOSTAS[`qtde_${m.id}`]?.valor||0,b=RESPOSTAS[`queim_${m.id}`]?.valor||0,d=RESPOSTAS[`defeito_${m.id}`]?.valor||0,area=body.querySelector(".status-auto");
 const critQ=Number(b)>0,critD=Number(d)>0;
 area.innerHTML=`<span class="status-chip ${critQ?"chip-alta":"chip-ok"}">Queimadas: ${critQ?"ALTA":"NORMAL"}</span><span class="status-chip ${critD?"chip-baixa":"chip-ok"}">Defeitos: ${critD?"BAIXA":"NORMAL"}</span>`;

function montarSecoes(){
 const container=$("secoes-container");container.innerHTML="";
 let contadorGlobal = 1; // Variável para numerar as perguntas

 FORMULARIO_ATUAL.secoes.forEach(secao=>{
  const s=document.createElement("section");s.className="secao";const h=document.createElement("h3");h.textContent=secao.titulo;s.append(h);
  
  if(secao.tipo_especial==="modelos_lampadas"){
    const wrap=document.createElement("div");s.append(wrap);renderizarModelosLampadas(wrap);container.append(s);return;
  }
  
  secao.itens.forEach(item=>{
   const div=document.createElement("div");div.className="item";
   const p=document.createElement("div");p.className="item-pergunta";
   
   // Adiciona a numeração na pergunta
   p.innerHTML = `<span class="item-numero">${contadorGlobal}.</span> <span>${escapar(item.pergunta)}</span>`;
   contadorGlobal++;
   
   div.append(p);
   if(item.ajuda){const a=document.createElement("div");a.className="item-ajuda";a.textContent=item.ajuda;div.append(a);}
   const r=RESPOSTAS[item.id]||{};
   
   // Bloco de Criticidade (Precisa ser criado antes para usar a referência na resposta Sim/Não)
   let blockCrit = null;
   if(!item.sem_critica){
     blockCrit = document.createElement("div");
     blockCrit.className = "crit-block";
     blockCrit.innerHTML = `<div class="criticidade-label">Criticidade avaliada pelo técnico *</div>`;
     const cr=document.createElement("div");cr.className="criticidades";
     [["alta","🔴 Alta"],["baixa","🟡 Baixa"],["operando","🔵 Normal"]].forEach(([key,txt])=>{
       const b=document.createElement("button");b.type="button";b.dataset.crit=key;b.textContent=txt;if(r.criticidade===key)b.classList.add("ativo");b.onclick=()=>salvarCrit(item.id,key,b);cr.append(b);
     });
     blockCrit.append(cr);
   }

   if(item.tipo==="numero"){
     const input=document.createElement("input");input.type="number";input.inputMode="numeric";input.min="0";input.step="1";input.placeholder="Informe a quantidade";input.value=r.valor??"";
     
     const aplicarCorAuto = () => {
       if (!item.auto_crit) return;
       const val = Number(input.value || 0);
       input.classList.remove("input-auto-alta", "input-auto-baixa", "input-auto-ok");
       if (val > 0) {
         input.classList.add(item.auto_crit === "alta" ? "input-auto-alta" : "input-auto-baixa");
       } else if (input.value !== "") {
         input.classList.add("input-auto-ok");
       }
     };
     
     if (item.auto_crit) aplicarCorAuto();
     
     input.addEventListener("input",e=>{
       if(Number(e.target.value)<0) e.target.value=0;
       salvarResp(item.id,e.target.value);
       aplicarCorAuto();
     });
     div.append(input);
   }
   else{
    const ops=document.createElement("div");ops.className="opcoes-resposta";
    ["Sim","Não","N/A"].forEach(op=>{
      const b=document.createElement("button");b.type="button";b.textContent=op;
      if(r.resposta===op)b.classList.add(op==="Sim"?"ativo-sim":op==="Não"?"ativo-nao":"ativo-na");
      
      b.onclick=()=>{
        ops.querySelectorAll("button").forEach(x=>x.classList.remove("ativo-sim","ativo-nao","ativo-na"));
        b.classList.add(op==="Sim"?"ativo-sim":op==="Não"?"ativo-nao":"ativo-na");
        RESPOSTAS[item.id]={...(RESPOSTAS[item.id]||{}),resposta:op};

        // Lógica condicional da criticidade
        if (blockCrit && item.condicional_crit) {
          if (op === "Sim") {
            blockCrit.style.display = "block";
          } else {
            blockCrit.style.display = "none";
            RESPOSTAS[item.id].criticidade = null; // Limpa se desmarcar
            blockCrit.querySelectorAll("button").forEach(x=>x.classList.remove("ativo"));
          }
        }
      };
      ops.append(b);
    });
    div.append(ops);
   }
   
   if(blockCrit){
     // Se for condicional e a resposta já não for Sim, inicia escondido
     if(item.condicional_crit && r.resposta !== "Sim"){
       blockCrit.style.display = "none";
     }
     div.append(blockCrit);
   }
   
   const obs=document.createElement("textarea");obs.placeholder="Observações: identifique o equipamento, localização, sintoma ou código de falha quando aplicável.";obs.value=r.observacao||"";obs.addEventListener("input",e=>{RESPOSTAS[item.id]={...(RESPOSTAS[item.id]||{}),observacao:e.target.value};});div.append(obs);
   const fotos=document.createElement("div");fotos.className="foto-area";
   (r.fotos||[]).forEach(f=>adicionarPreview(fotos,item.id,f));
   const lab=document.createElement("label");lab.textContent="📷 Anexar foto";const file=document.createElement("input");file.type="file";file.accept="image/*";file.multiple=true;file.onchange=e=>Array.from(e.target.files).forEach(f=>comprimirImagem(f,850,b64=>{RESPOSTAS[item.id]={...(RESPOSTAS[item.id]||{}),fotos:[...(RESPOSTAS[item.id]?.fotos||[]),b64]};adicionarPreview(fotos,item.id,b64,lab);}));lab.append(file);fotos.append(lab);div.append(fotos);s.append(div);
  });container.append(s);
 });
}
function adicionarPreview(area,id,b64,antes){const p=document.createElement("div");p.className="foto-preview";const img=document.createElement("img");img.src=b64;const btn=document.createElement("button");btn.type="button";btn.textContent="×";btn.onclick=()=>{const arr=RESPOSTAS[id]?.fotos||[];const i=arr.lastIndexOf(b64);if(i>=0)arr.splice(i,1);p.remove();};p.append(img,btn);area.insertBefore(p,antes||area.lastChild);}
function escapar(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// Numeração calculada pelo histórico: ao excluir, a numeração volta junto
function gerarNumeroRelatorio(teste){
 const ano=new Date().getFullYear(),pre=teste?"TESTE":"PREV",re=new RegExp(`^${pre}-${ano}-(\\d+)$`);
 const maior=lerHistorico().reduce((m,r)=>{const x=re.exec(r.numero||"");return x?Math.max(m,parseInt(x[1],10)):m;},0);
 return `${pre}-${ano}-${String(maior+1).padStart(4,"0")}`;
}

function validarFormulario(){
 const obrig=["local","tecnico","chapa","data"];for(const id of obrig){if(!$(id).value.trim()){alert("Preencha todos os campos obrigatórios da identificação.");$(id).focus();return false;}}
 for(const s of FORMULARIO_ATUAL.secoes){if(s.tipo_especial==="modelos_lampadas"){
  for(const m of MODELOS_LAMPADAS.filter(x=>x.ativo)){const q=RESPOSTAS[`qtde_${m.id}`]?.valor,b=RESPOSTAS[`queim_${m.id}`]?.valor,d=RESPOSTAS[`defeito_${m.id}`]?.valor;if(q===""||q==null){alert(`Informe a quantidade instalada do modelo ${m.nome}.`);return false;}if([b,d].some(x=>x===""||x==null)){alert(`Informe as quantidades queimadas e com defeito do modelo ${m.nome}. Use zero quando não houver ocorrência.`);return false;}if(Number(b)+Number(d)>Number(q)){alert(`No modelo ${m.nome}, a soma de queimadas e defeituosas não pode superar a quantidade instalada.`);return false;}}
  }else for(const it of s.itens){
    const r=RESPOSTAS[it.id]||{};
    if(it.tipo==="numero"&&r.valor!==undefined&&Number(r.valor)<0){alert("As quantidades não podem ser negativas.");return false;}
    if(it.tipo==="sim_nao"&&!r.resposta){alert(`Responda ao item: ${it.pergunta}`);return false;}
    
    // Validação condicional
    if(!it.sem_critica){
      if(it.condicional_crit) {
         if (r.resposta === "Sim" && !r.criticidade) {
             alert(`Selecione a criticidade avaliada pelo técnico para a resposta "Sim": ${it.pergunta}`); return false;
         }
      } else {
         if (r.resposta !== "N/A" && !r.criticidade) {
             alert(`Selecione a criticidade avaliada pelo técnico (ou marque N/A): ${it.pergunta}`); return false;
         }
      }
    }
  }
 }
 if(FORMULARIO_ATUAL.id==="luminotecnico"){
  const total=Number(RESPOSTAS.q_total_geral?.valor||0),soma=MODELOS_LAMPADAS.filter(m=>m.ativo).reduce((a,m)=>a+Number(RESPOSTAS[`qtde_${m.id}`]?.valor||0),0);
  if(MODELOS_LAMPADAS.some(m=>m.ativo)&&total!==soma){if(!confirm(`Atenção: o total geral informado (${total}) é diferente da soma dos modelos selecionados (${soma}). Deseja gerar mesmo assim?`))return false;}
 }
 return true;
}

 const modelos=MODELOS_LAMPADAS.filter(m=>m.ativo).map(m=>({id:m.id,nome:m.nome,quantidade:RESPOSTAS[`qtde_${m.id}`]?.valor||"0",queimadas:RESPOSTAS[`queim_${m.id}`]?.valor||"0",defeito:RESPOSTAS[`defeito_${m.id}`]?.valor||"0",critQueimadas:criticidadeAutomatica(RESPOSTAS[`queim_${m.id}`]?.valor,0),critDefeito:criticidadeAutomatica(0,RESPOSTAS[`defeito_${m.id}`]?.valor)}));
 const ehTeste=$("eh-teste").checked;

 const hist=lerHistorico();const anteriores=hist.filter(x=>x.tipo===rel.tipo&&!!x.teste===!!rel.teste&&normalizar(x.cabecalho?.local)===normalizar(rel.cabecalho.local)).slice(0,3);
 rel.comparativo=construirComparativo(rel,anteriores);hist.unshift(rel);
 try{localStorage.setItem("historico",JSON.stringify(hist));}catch(e){alert("O armazenamento do navegador está cheio. Exclua relatórios antigos ou reduza a quantidade de fotos antes de continuar. O relatório não foi salvo.");return;}
 gerarPDF(rel);alert("Relatório gerado e salvo no histórico. O PDF inclui a comparação com até três inspeções anteriores do mesmo local e tipo.");$("tela-formulario").classList.add("escondido");$("tela-inicial").classList.remove("escondido");
}
function normalizar(s){return String(s||"").trim().toLocaleLowerCase("pt-BR").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ");}
function mapaItens(rel){
 const out={};
 (rel.secoes||[]).forEach(s=>(s.itens||[]).forEach(it=>{
  const r=rel.respostas?.[it.id]||{};
  out[it.id]={pergunta:it.pergunta,resposta:r.resposta??r.valor??"",criticidade:r.criticidade||"",observacao:r.observacao||"",tipo:it.tipo};
 }));
 (rel.modelos_lampadas||[]).forEach(m=>{
  const chave=normalizar(m.nome);
  out[`lamp_${chave}_queimadas`]={pergunta:`${m.nome} — queimadas`,resposta:String(m.queimadas||0),criticidade:Number(m.queimadas)>0?"alta":"operando",tipo:"quantidade"};
  out[`lamp_${chave}_defeito`]={pergunta:`${m.nome} — com defeito`,resposta:String(m.defeito||0),criticidade:Number(m.defeito)>0?"baixa":"operando",tipo:"quantidade"};
 });
 return out;
}
function construirComparativo(atual,anteriores){
 const agora=mapaItens(atual),melhorou=[],piorou=[],permanece=[],novos=[];
 if(!anteriores.length)return{quantidade:0,anteriores:[],melhorou,piorou,permanece,novos};
 const anterior=mapaItens(anteriores[0]);
 Object.keys(agora).forEach(k=>{
  const a=agora[k],p=anterior[k];if(!p)return;
  const antesRuim=itemEstaComProblema(p),agoraRuim=itemEstaComProblema(a);
  if(antesRuim&&!agoraRuim)melhorou.push({item:a.pergunta,antes:resumoEstado(p),agora:resumoEstado(a)});
  else if(!antesRuim&&agoraRuim)piorou.push({item:a.pergunta,antes:resumoEstado(p),agora:resumoEstado(a)});
  else if(antesRuim&&agoraRuim)permanece.push({item:a.pergunta,antes:resumoEstado(p),agora:resumoEstado(a)});
 });
 Object.keys(agora).filter(k=>!anterior[k]&&itemEstaComProblema(agora[k])).forEach(k=>novos.push({item:agora[k].pergunta,agora:resumoEstado(agora[k])}));
 return{quantidade:anteriores.length,anteriores:anteriores.map(x=>({numero:x.numero,data:x.cabecalho.data,geradoEm:x.geradoEm})),melhorou,piorou,permanece,novos};
}
function resumoEstado(x){return `${x.resposta!==""?x.resposta:"Sem resposta"}${x.criticidade?` / ${x.criticidade.toUpperCase()}`:""}`;}
function formatarData(d){if(!d)return"—";const p=String(d).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d;}

const _emojiCache={};
function emojiPNG(ch){
 if(_emojiCache[ch]!==undefined)return _emojiCache[ch];
 try{
  const c=document.createElement("canvas");c.width=c.height=96;
  const x=c.getContext("2d");x.textAlign="center";x.textBaseline="middle";
  x.font='70px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  x.fillText(ch,48,52);_emojiCache[ch]=c.toDataURL("image/png");
 }catch(e){_emojiCache[ch]=null;}
 return _emojiCache[ch];
}
function desenharEmoji(doc,ch,x,y,s){
 const d=emojiPNG(ch);
 if(d){try{doc.addImage(d,"PNG",x,y,s,s);return;}catch(e){}}
 const cor={"🔴":[220,38,38],"🟡":[217,119,6],"🔵":[37,99,235],"✅":[5,150,105]}[ch]||[217,119,6];
 doc.setFillColor(...cor);doc.circle(x+s/2,y+s/2,s/2.3,"F");
}
function itemEstaComProblema(x){
 if(!x)return false;
 if(x.resposta === "N/A") return false;
 if(x.tipo==="quantidade")return Number(x.resposta)>0;
 const q=normalizar(x.pergunta);
 if(x.tipo==="numero")return /queimad|defeit|inoperant|falha|avaria|danificad|pendencia/.test(q)&&Number(x.resposta)>0;
 if(/reaperto autorizado/.test(q))return false;
 const simIndicaFalha=/\b(ha|existe|apresenta|apresentando|possui|foi identificad[oa]|foi necessari[oa]|sera necessari[oa]|necessario|necessidade de|sinais de|cheiro de)\b/.test(q);
 if(x.resposta==="Sim")return simIndicaFalha;
 if(x.resposta==="Não")return !simIndicaFalha;
 return x.criticidade==="alta"||x.criticidade==="baixa";
}
function statusItemPDF(it,r){
 if(r.resposta === "N/A") return null;
 if(r.criticidade)return r.criticidade;
 const q=normalizar(it.pergunta);
 if(it.tipo==="numero"){
  const n=Number(r.valor||0);
  if(/queimad/.test(q))return n>0?"alta":"operando";
  if(/defeit|inoperant|falha|avaria|danificad/.test(q))return n>0?"baixa":"operando";
  return null;
 }
 if(!r.resposta)return null;
 return itemEstaComProblema({pergunta:it.pergunta,resposta:r.resposta,tipo:it.tipo,criticidade:""})?"baixa":"operando";
}
function gerarPDF(rel){
 const{jsPDF}=window.jspdf,doc=new jsPDF("p","mm","a4");
 doc.setLineHeightFactor(1.35);
 const PW=210,M=14,W=182,TOPO=20,FIM=280;
 const COR=PDF_CORES[rel.tipo]||[31,41,55],INK=[31,41,55],MUTED=[100,116,139];
 let y=0;
 const ensure=h=>{if(y+h>FIM){doc.addPage();y=TOPO;}};
 const fonte=(bold,size,cor)=>{doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size);doc.setTextColor(...(cor||[20,20,20]));};
 const linhas=(t,w)=>doc.splitTextToSize(String(t??""),w);
 const titulo=(t,c)=>{ensure(22);doc.setFillColor(...INK);doc.roundedRect(M,y,W,8,1.5,1.5,"F");doc.setFillColor(...(c||COR));doc.roundedRect(M,y,2.6,8,1,1,"F");fonte(true,10,[255,255,255]);doc.text(t,M+6,y+5.4);y+=11.5;};

 /* Cabeçalho com logo e nome do app */
 doc.setFillColor(...INK);doc.rect(0,0,PW,34,"F");doc.setFillColor(...COR);doc.rect(0,34,PW,2.2,"F");
 try{doc.addImage(LOGO_B64,"PNG",M,6,22,22);}catch(e){}
 fonte(true,7.5,[163,230,53]);doc.text("PREVENT APP",M+26,11);
 fonte(true,13.5,[255,255,255]);doc.text(rel.titulo,M+26,18);
 fonte(false,8,[203,213,225]);doc.text("REGISTRO DE MANUTENÇÃO PREVENTIVA",M+26,24.5);
 doc.setFillColor(255,255,255);doc.roundedRect(PW-M-52,9,52,17,2,2,"F");
 fonte(false,7,MUTED);doc.text("RELATÓRIO Nº",PW-M-26,14.5,{align:"center"});
 fonte(true,11,INK);doc.text(rel.numero,PW-M-26,21.5,{align:"center"});
 y=44;

 /* Identificação */
 const c=rel.cabecalho;fonte(true,9.5);
 const lLocal=linhas(c.local,W-10);
 const r2=y+10.2+(lLocal.length-1)*4.8+4,r3=r2+11,hCard=r3+11-y;
 doc.setDrawColor(226,232,240);doc.setFillColor(248,250,252);doc.roundedRect(M,y,W,hCard,2,2,"FD");
 const campo=(rot,val,x,yy)=>{fonte(false,6.8,MUTED);doc.text(rot,x,yy);fonte(true,9.5);doc.text(linhas(val,W/2-8)[0]||"—",x,yy+4.8);};

 y+=hCard+6;

 /* Resumo */
 const cont={alta:0,baixa:0,operando:0};
 (rel.secoes||[]).forEach(s=>(s.itens||[]).forEach(it=>{const st=statusItemPDF(it,rel.respostas?.[it.id]||{});if(st)cont[st]++;}));

 const cw=(W-8)/3;
 [["alta","ITENS EM ALTA"],["baixa","ITENS EM BAIXA"],["operando","ITENS NORMAIS"]].forEach(([k,rot],i)=>{
  const S=PDF_ST[k],x=M+i*(cw+4);

 });
 y+=25;

 /* Itens */
 function fotosGrid(fotos){
  const gap=3,cwf=(W-10-2*gap)/3,ch=46;
  ensure(10);desenharEmoji(doc,"📷",M+10,y,3.6);fonte(true,7.5,MUTED);doc.text(`REGISTRO FOTOGRÁFICO (${fotos.length})`,M+15,y+3);y+=6;
  fotos.forEach((f,i)=>{
   const col=i%3;if(col===0)ensure(ch+7);
   const x=M+10+col*(cwf+gap);
   doc.setDrawColor(203,213,225);doc.setFillColor(248,250,252);doc.roundedRect(x,y,cwf,ch,1.5,1.5,"FD");
   try{const p=doc.getImageProperties(f);let w=cwf-2,h=w*p.height/p.width;if(h>ch-2){h=ch-2;w=h*p.width/p.height;}doc.addImage(f,"JPEG",x+(cwf-w)/2,y+(ch-h)/2,w,h);}catch(e){}
   fonte(false,6.8,MUTED);doc.text(`Foto ${i+1}`,x+cwf/2,y+ch+3.2,{align:"center"});
   if(col===2||i===fotos.length-1)y+=ch+6;
  });
  y+=1;
 }
 
 let contadorPDF = 1; // Numeração no PDF também
 
 function linhaItem(it){
  const r=rel.respostas?.[it.id]||{},st=statusItemPDF(it,r),S=st?PDF_ST[st]:null;
  const res=it.tipo==="numero"?String(r.valor??"—"):(r.resposta||"—");
  
  // Adiciona o número na pergunta do PDF
  const textoPergunta = `${contadorPDF}. ${it.pergunta}`;
  contadorPDF++;
  
  fonte(false,9);const ql=linhas(textoPergunta,W-50);
  const hq=Math.max(ql.length*4.3+4,r.criticidade?12.5:9);
  ensure(hq+2);
  if(st==="alta"||st==="baixa"){doc.setFillColor(...S.cor);doc.rect(M,y,1,hq-0.5,"F");}
  if(S)desenharEmoji(doc,S.emoji,M+3.5,y+(hq-4.4)/2,4.4);
  fonte(false,9,[17,24,39]);doc.text(ql,M+11,y+4.6);
  const cx=M+W-32,cy=r.criticidade?y+1.6:y+(hq-6.4)/2;
  doc.setFillColor(...(S?S.fundo:[241,245,249]));doc.roundedRect(cx,cy,30,6.4,1.6,1.6,"F");
  fonte(true,9,S?S.texto:[51,65,85]);doc.text(res,cx+15,cy+4.5,{align:"center"});
  if(r.criticidade){fonte(true,6.8,S.texto);doc.text(S.nome,cx+15,cy+10.4,{align:"center"});}
  y+=hq;doc.setDrawColor(226,232,240);doc.line(M,y,M+W,y);y+=1.5;
  if(r.observacao){
   fonte(false,8.2);const ol=linhas("Observação: "+r.observacao,W-18),h=ol.length*3.9+3;
   ensure(h+2);doc.setFillColor(248,250,252);doc.rect(M+10,y,W-10,h,"F");doc.setFillColor(...(S?S.cor:[148,163,184]));doc.rect(M+10,y,0.9,h,"F");
   fonte(false,8.2,[71,85,105]);doc.text(ol,M+14,y+4.2);y+=h+2;
  }
  if(r.fotos?.length)fotosGrid(r.fotos);
 }
 
 function tabelaModelos(){
  const ms=rel.modelos_lampadas||[],total=Number(rel.respostas?.q_total_geral?.valor||0);
  fonte(true,9,INK);doc.text(`Total geral informado no local: ${total} lâmpada(s)`,M+2,y+3);y+=7;
  if(!ms.length){fonte(false,9,MUTED);doc.text("Nenhum modelo de lâmpada foi discriminado.",M+2,y+3);y+=9;return;}
  const X=[M+4,M+82,M+107,M+134,M+158];

  let sI=0,sQ=0,sD=0;
  ms.forEach((m,i)=>{
   const q=Number(m.queimadas||0),d=Number(m.defeito||0),n=Number(m.quantidade||0);sI+=n;sQ+=q;sD+=d;
   ensure(9);if(i%2)doc.setFillColor(248,250,252);else doc.setFillColor(255,255,255);doc.rect(M,y,W,8.5,"F");
   fonte(true,9);doc.text(linhas(m.nome,74)[0],X[0],y+5.6);
   fonte(false,9);doc.text(String(n),X[1],y+5.6);
   if(q>0){desenharEmoji(doc,"🔴",X[2],y+2.1,4.2);fonte(true,9,PDF_ST.alta.texto);doc.text(String(q),X[2]+6,y+5.6);}else{fonte(false,9);doc.text("0",X[2],y+5.6);}
   if(d>0){desenharEmoji(doc,"🟡",X[3],y+2.1,4.2);fonte(true,9,PDF_ST.baixa.texto);doc.text(String(d),X[3]+6,y+5.6);}else{fonte(false,9);doc.text("0",X[3],y+5.6);}
   const S=PDF_ST[q>0?"alta":d>0?"baixa":"operando"];
   desenharEmoji(doc,S.emoji,X[4],y+2.1,4.2);fonte(true,8,S.texto);doc.text(S.nome,X[4]+5.5,y+5.6);
   y+=8.5;
  });
  ensure(10);doc.setFillColor(226,232,240);doc.rect(M,y,W,8,"F");fonte(true,8.5,INK);
  doc.text("TOTAL DISCRIMINADO",X[0],y+5.4);doc.text(String(sI),X[1],y+5.4);doc.text(String(sQ),X[2],y+5.4);doc.text(String(sD),X[3],y+5.4);y+=11;
  ensure(8);
  if(sI!==total){desenharEmoji(doc,"⚠️",M+2,y,4);fonte(true,8.3,PDF_ST.baixa.texto);doc.text(`Atenção: o total geral (${total}) difere da soma dos modelos (${sI}).`,M+8,y+3.1);}
  else{desenharEmoji(doc,"✅",M+2,y,4);fonte(false,8.3,[6,95,70]);doc.text("Total geral confere com a soma dos modelos discriminados.",M+8,y+3.1);}
  y+=8;
 }
 
 (rel.secoes||[]).forEach(sec=>{
  titulo(sec.titulo);
  if(sec.tipo_especial==="modelos_lampadas")tabelaModelos();else(sec.itens||[]).forEach(linhaItem);
  y+=4;
 });

 /* Encerramento */
 titulo("Encerramento da atividade");
 const sf=rel.statusFinal||"Não informado",ok=/sem pend/i.test(sf);
 ensure(16);doc.setFillColor(...(ok?[209,250,229]:[254,243,199]));doc.roundedRect(M,y,W,11,2,2,"F");
 desenharEmoji(doc,ok?"✅":"⚠️",M+4,y+3.2,4.6);fonte(true,10.5,ok?[6,95,70]:PDF_ST.baixa.texto);doc.text(`Status da preventiva: ${sf}`,M+12,y+7.2);y+=15;
 const caixa=(rot,txt,emo)=>{
  if(!txt)return;fonte(false,9);const l=linhas(txt,W-8),h=l.length*4.3+11;ensure(h+3);
  doc.setDrawColor(226,232,240);doc.setFillColor(255,255,255);doc.roundedRect(M,y,W,h,2,2,"FD");
  desenharEmoji(doc,emo,M+3.5,y+2.6,3.8);fonte(true,8,INK);doc.text(rot,M+9,y+5.4);fonte(false,9,[30,41,59]);doc.text(l,M+4,y+11);y+=h+3;
 };
 caixa("PENDÊNCIAS E RECOMENDAÇÕES",rel.pendencias,"⚠️");caixa("CONTRAMEDIDAS ADOTADAS",rel.contramedidas,"🛠️");
 y+=3;

 /* Comparativo */
 titulo("Comparativo com inspeções anteriores",[100,116,139]);
 const cmp=rel.comparativo||{quantidade:0};
 if(!cmp.quantidade){
  fonte(false,9,MUTED);const l=linhas("Este é o primeiro relatório registrado para este local e tipo de preventiva. Ainda não há inspeções anteriores para comparação.",W-4);
  ensure(l.length*4.3+2);doc.text(l,M+2,y+3);y+=l.length*4.3+4;
 }else{
  fonte(false,8,MUTED);const l=linhas(`Comparação direta com a inspeção mais recente. Histórico consultado: ${(cmp.anteriores||[]).map(a=>`${a.numero} (${formatarData(a.data)})`).join(", ")}.`,W-4);
  ensure(l.length*3.9+2);doc.text(l,M+2,y+3);y+=l.length*3.9+4;
  const grupo=(nome,emo,arr,cor)=>{
   ensure(14);desenharEmoji(doc,emo,M+2,y,4);fonte(true,9,cor);doc.text(`${nome} (${arr.length})`,M+8,y+3.3);y+=7;
   if(!arr.length){fonte(false,8.2,MUTED);doc.text("Nenhuma alteração identificada.",M+8,y+2);y+=6;return;}
   arr.forEach(x=>{
    fonte(false,8.3);const t=linhas(`${x.item}: ${x.antes?`antes ${x.antes}  |  agora ${x.agora}`:(x.agora||"")}`,W-12);
    ensure(t.length*3.95+2);doc.setFillColor(...cor);doc.circle(M+9.5,y+1.4,0.7,"F");fonte(false,8.3,[30,41,59]);doc.text(t,M+12,y+2.4);y+=t.length*3.95+1.8;
   });y+=2;
  };
  grupo("MELHORIAS IDENTIFICADAS","✅",cmp.melhorou||[],[5,120,75]);
  grupo("NOVAS OCORRÊNCIAS / PIORAS","🔴",cmp.piorou||[],[190,35,35]);
  grupo("OCORRÊNCIAS QUE PERMANECEM","🟡",cmp.permanece||[],[180,110,0]);
  grupo("ITENS NOVOS COM OCORRÊNCIA","⚠️",cmp.novos||[],[190,35,35]);
 }

 /* Assinatura */
 ensure(40);y+=12;doc.setDrawColor(100,116,139);doc.line(M,y,M+88,y);doc.line(M+W-55,y,M+W,y);
 fonte(true,9);doc.text(c.tecnico,M,y+5);fonte(false,8,MUTED);doc.text(`Chapa ${c.chapa}  |  CFT/CREA ${c.cftCrea||"—"}`,M,y+9.5);
 fonte(true,9);doc.text(formatarData(c.data),M+W-27.5,y+5,{align:"center"});fonte(false,8,MUTED);doc.text("Data da inspeção",M+W-27.5,y+9.5,{align:"center"});
 y+=18;

 /* Legenda */
 ensure(18);doc.setFillColor(248,250,252);doc.roundedRect(M,y,W,14,2,2,"F");fonte(true,7.3,INK);doc.text("LEGENDA DE CRITICIDADE",M+4,y+4.6);
 [["alta","ALTA — crítica / inoperante"],["baixa","BAIXA — anomalia / defeito leve"],["operando","NORMAL — condição normal"]].forEach(([k,t],i)=>{
  const x=M+4+i*59;desenharEmoji(doc,PDF_ST[k].emoji,x,y+6.4,4);fonte(false,7.5,[70,70,70]);doc.text(t,x+5.5,y+9.6);
 });

 /* Cabeçalho das páginas seguintes e rodapé (com logo e nome do app) */
 const n=doc.getNumberOfPages();
 for(let i=1;i<=n;i++){
  doc.setPage(i);

  fonte(true,7,MUTED);const wb=doc.getTextWidth("Prevent App");doc.text("Prevent App",M+6,291);
  fonte(false,7,MUTED);doc.text(doc.splitTextToSize(`|  ${rel.numero}  |  ${c.local}`,120)[0],M+6+wb+2,291);
  doc.text(`Página ${i} de ${n}`,PW-M,291,{align:"right"});
 }
 doc.save(`${rel.numero}.pdf`);
}

/* ===== Histórico: excluir um a um, marcados, testes ou tudo ===== */
let SELECIONADOS=new Set();
function abrirHistorico(){SELECIONADOS=new Set();$("input-busca").value="";renderizarHistorico();$("modal-historico").classList.remove("escondido");}
function fecharHistorico(){$("modal-historico").classList.add("escondido");}
function listaFiltrada(){const t=normalizar($("input-busca").value);return lerHistorico().filter(r=>normalizar(`${r.cabecalho?.local} ${r.numero} ${r.titulo}`).includes(t));}
function filtrarHistorico(){renderizarHistorico(listaFiltrada());}
function atualizarQtdSel(){$("qtd-sel").textContent=SELECIONADOS.size;}
function renderizarHistorico(listaDados){
 const hist=lerHistorico(),lista=$("lista-historico");lista.innerHTML="";const dados=listaDados||hist;
 if(!dados.length){lista.innerHTML='<p class="sem-resultado">Nenhum relatório encontrado.</p>';atualizarQtdSel();return;}
 dados.forEach(rel=>{
  const idx=hist.findIndex(x=>x.numero===rel.numero),div=document.createElement("div");div.className="hist-item";
  const chk=document.createElement("input");chk.type="checkbox";chk.checked=SELECIONADOS.has(rel.numero);chk.style.cssText="width:20px;height:20px;flex-shrink:0";
  chk.onchange=()=>{chk.checked?SELECIONADOS.add(rel.numero):SELECIONADOS.delete(rel.numero);atualizarQtdSel();};
  const info=document.createElement("div");info.className="hist-info";info.style.flex="1";
  const strong=document.createElement("strong");strong.textContent=`${rel.numero} — ${rel.titulo}`;
  if(rel.teste){const b=document.createElement("em");b.className="badge-teste";b.textContent="TESTE";strong.append(b);}
  const span=document.createElement("span");span.textContent=`${rel.cabecalho?.local||"Local não informado"} • ${formatarData(rel.cabecalho?.data)}`;
  info.append(strong,span);
  const actions=document.createElement("div");actions.className="hist-botoes";
  const baixar=document.createElement("button");baixar.className="btn-ver";baixar.textContent="PDF";baixar.onclick=()=>baixarPdfHistorico(idx);
  const apagar=document.createElement("button");apagar.className="btn-del";apagar.textContent="Excluir";apagar.onclick=()=>{if(confirm(`Excluir o relatório ${rel.numero}?`))removerDoHistorico(new Set([rel.numero]));};
  actions.append(baixar,apagar);div.append(chk,info,actions);lista.append(div);
 });
 atualizarQtdSel();
}
function removerDoHistorico(numeros){
 const restante=lerHistorico().filter(r=>!numeros.has(r.numero));
 localStorage.setItem("historico",JSON.stringify(restante));
 numeros.forEach(n=>SELECIONADOS.delete(n));
 filtrarHistorico();
}
function selecionarTodosHist(){
 const vis=listaFiltrada();const todos=vis.length&&vis.every(r=>SELECIONADOS.has(r.numero));
 vis.forEach(r=>todos?SELECIONADOS.delete(r.numero):SELECIONADOS.add(r.numero));
 renderizarHistorico(vis);
}
function excluirSelecionados(){
 if(!SELECIONADOS.size){alert("Marque pelo menos um relatório.");return;}
 if(confirm(`Excluir ${SELECIONADOS.size} relatório(s) marcado(s)? Isso não pode ser desfeito.`))removerDoHistorico(new Set(SELECIONADOS));
}
function excluirTestes(){
 const t=lerHistorico().filter(r=>r.teste);
 if(!t.length){alert("Não há relatórios marcados como teste.");return;}
 if(confirm(`Excluir ${t.length} relatório(s) de teste?`))removerDoHistorico(new Set(t.map(r=>r.numero)));
}
function excluirTudo(){
 const h=lerHistorico();if(!h.length)return;
 if(!confirm(`Excluir TODOS os ${h.length} relatórios do histórico? A próxima preventiva volta a ser a 0001.`))return;
 localStorage.setItem("historico","[]");
 SELECIONADOS=new Set();filtrarHistorico();
}
function baixarPdfHistorico(index){const r=lerHistorico()[index];if(r)gerarPDF(r);}
